[workspace]
members = [
  "crates/feather-core",
  "crates/feather-cli",
  "crates/featherd",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/ricardodevries/feather"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
feather-core = { path = "crates/feather-core" }
hidapi = { version = "2.6.6", default-features = false, features = ["linux-native"] }
humantime = "2.3"
humantime-serde = "1.1"
nvml-wrapper = "0.12.1"
sd-notify = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.21"
thiserror = "2.0"
tokio = { version = "1.47", default-features = false }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
await_holding_lock = "deny"
clone_on_copy = "warn"
dbg_macro = "deny"
expect_used = "deny"
redundant_clone = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
